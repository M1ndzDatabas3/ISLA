texto: "O capital é trabalho morto, que, como um vampiro, vive apenas da sucção de trabalho vivo, e vive tanto mais quanto mais trabalho vivo suga."
autor: karl-marx
fonte: "O capital, Livro I (1867), capítulo 8, “A jornada de trabalho”"
conferir: "[CONFERIR tradução e página]"
livro: o-capital-livro-1
contexto: "A frase está no capítulo sobre a jornada de trabalho, em que Marx reconstrói, a partir dos relatórios dos inspetores de fábrica ingleses, a luta dos operários pela limitação legal das horas de trabalho."
