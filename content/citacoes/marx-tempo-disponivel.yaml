texto: "A medida da riqueza não é mais, de modo algum, o tempo de trabalho, mas o tempo disponível."
autor: karl-marx
fonte: "Grundrisse (1857-1858), “fragmento sobre as máquinas”, tradução nossa"
original:
  texto: "Es ist dann keineswegs mehr die Arbeitszeit, sondern die disposable time das Maß des Reichtums."
  idioma: "de"
contexto: "Nos manuscritos preparatórios de O capital, escritos entre 1857 e 1858 e publicados só no século XX, Marx observa que a grande indústria faz a riqueza depender cada vez menos do tempo de trabalho e cada vez mais da ciência e da técnica. A frase imagina a consequência: uma sociedade em que o tempo liberado do trabalho, e não o trabalho excedente, seria a medida da riqueza."
