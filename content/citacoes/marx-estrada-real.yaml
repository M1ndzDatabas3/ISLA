texto: "Não há estrada real para a ciência, e só têm probabilidade de chegar a seus cimos luminosos aqueles que enfrentam a canseira para galgá-los por veredas abruptas."
autor: karl-marx
fonte: "O capital, Livro I, prefácio à edição francesa (1872)"
conferir: "[CONFERIR tradução]"
livro: o-capital-livro-1
contexto: "Marx escreveu a frase em 1872, na carta ao editor Maurice Lachâtre que abre a edição francesa de O capital, publicada em fascículos. Ele aprovava o formato, que tornava o livro mais acessível aos trabalhadores, mas advertia que os primeiros capítulos, pelo método de análise, exigiriam esforço do leitor."
