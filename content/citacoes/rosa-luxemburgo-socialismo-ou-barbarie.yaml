texto: "A sociedade burguesa está diante de um dilema: ou transição ao socialismo, ou recaída na barbárie."
autor: "rosa-luxemburgo"
fonte: "A crise da social-democracia (Brochura de Junius), escrita em 1915 e publicada em 1916; a autora atribui a formulação a Engels"
