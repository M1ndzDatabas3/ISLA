ano: 1984
data: "janeiro de 1984"
titulo: "Fundação do MST"
resumo: "Trabalhadores rurais de vários estados reúnem-se em Cascavel, no Paraná, no 1º Encontro Nacional dos Trabalhadores Rurais Sem Terra e fundam o Movimento dos Trabalhadores Rurais Sem Terra. O movimento nasce das ocupações de terra do fim dos anos 1970 e do início dos anos 1980, sobretudo no Sul do país, e faz da ocupação de latifúndios improdutivos sua principal forma de luta pela reforma agrária."
