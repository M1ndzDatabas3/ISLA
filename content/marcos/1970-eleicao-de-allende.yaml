ano: 1970
data: "4 de setembro de 1970"
titulo: "Eleição de Salvador Allende no Chile"
resumo: "Candidato da coalizão Unidade Popular, Salvador Allende obtém a maior votação na eleição presidencial, é confirmado pelo Congresso em outubro e toma posse em novembro. Seu governo nacionaliza a grande mineração do cobre e aprofunda a reforma agrária, até ser derrubado pelo golpe militar de 11 de setembro de 1973."
