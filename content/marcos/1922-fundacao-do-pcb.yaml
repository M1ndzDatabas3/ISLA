ano: 1922
data: "25 de março de 1922"
titulo: "Fundação do Partido Comunista do Brasil"
resumo: "Nove delegados, em sua maioria vindos de um movimento operário de forte influência anarquista, fundam em Niterói e no Rio de Janeiro o Partido Comunista do Brasil, filiado à Internacional Comunista. Poucos meses depois, o partido é posto na ilegalidade, condição em que passaria a maior parte das décadas seguintes."
