ano: 1871
data: "18 de março a 28 de maio de 1871"
titulo: "Comuna de Paris"
resumo: "Depois da derrota francesa na guerra contra a Prússia, a Guarda Nacional e os trabalhadores de Paris tomam o controle da cidade e elegem um conselho municipal que a governa por cerca de dois meses. A Comuna é esmagada pelas tropas do governo sediado em Versalhes na Semana Sangrenta, no fim de maio."
regiao: "europa"
