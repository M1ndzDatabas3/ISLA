ano: 1917
data: "fevereiro e outubro de 1917 (calendário juliano)"
titulo: "Revolução Russa"
resumo: "Em fevereiro, greves e motins em Petrogrado derrubam a monarquia e abrem um período de duplo poder entre o Governo Provisório e os sovietes. Em outubro (novembro no calendário gregoriano), os bolcheviques tomam o poder a partir do Soviete de Petrogrado, e o Segundo Congresso dos Sovietes aprova os decretos sobre a paz e sobre a terra."
regiao: "russia-urss"
areas: ["historia", "teoria-do-estado", "organizacao-politica"]
livros: ["o-estado-e-a-revolucao", "que-fazer"]
autores: ["vladimir-lenin", "rosa-luxemburgo"]
