ano: 1959
data: "1º de janeiro de 1959"
titulo: "Revolução Cubana"
resumo: "O ditador Fulgencio Batista foge de Cuba na madrugada de 1º de janeiro de 1959, depois de dois anos de guerrilha do Movimento 26 de Julho na Sierra Maestra e de mobilizações nas cidades. O novo governo faz a reforma agrária, nacionaliza empresas estrangeiras e, em abril de 1961, declara o caráter socialista da revolução."
