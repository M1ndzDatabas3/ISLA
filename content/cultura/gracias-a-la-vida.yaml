titulo: "Gracias a la vida"
tipo: "musica"
autoria: "Violeta Parra"
ano: 1966
pais: "Chile"
resumo: "Canção gravada por Violeta Parra no disco Las últimas composiciones, lançado em 1966, poucos meses antes de sua morte, em fevereiro de 1967. Em forma de agradecimento, enumera os sentidos, a palavra e o afeto, e tornou-se uma das canções mais regravadas da América Latina, em versões como as de Mercedes Sosa e Joan Baez."
