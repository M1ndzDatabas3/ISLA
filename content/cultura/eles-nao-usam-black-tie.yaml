titulo: "Eles não usam black-tie"
tipo: "filme"
autoria: "Leon Hirszman"
ano: 1981
pais: "Brasil"
resumo: "Adaptação da peça de Gianfrancesco Guarnieri, encenada em 1958 no Teatro de Arena, transposta para as greves operárias de São Paulo do fim dos anos 1970. Um jovem operário que decide furar a greve entra em choque com o pai, militante sindical, e o conflito familiar expõe dilemas de classe, solidariedade e organização."
