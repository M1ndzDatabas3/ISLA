titulo: "Memórias do subdesenvolvimento"
tipo: "filme"
autoria: "Tomás Gutiérrez Alea"
ano: 1968
pais: "Cuba"
resumo: "Baseado no romance de Edmundo Desnoes, o filme acompanha Sergio, um burguês que permanece em Havana depois que a família parte para Miami, no período que vai de 1961 à Crise dos Mísseis de 1962. Misturando ficção e material documental, observa a revolução pelo olhar de um personagem que não consegue aderir a ela nem abandoná-la."
