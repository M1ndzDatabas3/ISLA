titulo: "Vidas secas"
tipo: "literatura"
autoria: "Graciliano Ramos"
ano: 1938
pais: "Brasil"
resumo: "Romance sobre a família formada pelo vaqueiro Fabiano, por Sinhá Vitória, pelos dois filhos e pela cadela Baleia, que atravessa o sertão nordestino fugindo da seca. Em capítulos quase autônomos, mostra a exploração do trabalhador pelo fazendeiro, a violência das autoridades e a dificuldade de nomear a própria condição."
