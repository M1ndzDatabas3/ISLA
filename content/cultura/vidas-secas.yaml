titulo: "Vidas secas"
tipo: "literatura"
autoria: "Graciliano Ramos"
ano: 1938
pais: "Brasil"
resumo: "Romance sobre a família do vaqueiro Fabiano, de Sinhá Vitória, dos dois filhos e da cadela Baleia, que atravessa o sertão nordestino fugindo da seca. Em capítulos quase autônomos, mostra a exploração do trabalhador pelo fazendeiro, a violência das autoridades e a dificuldade de nomear a própria condição."
