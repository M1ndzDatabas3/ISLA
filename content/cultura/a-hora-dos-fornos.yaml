titulo: "A hora dos fornos (La hora de los hornos)"
tipo: "filme"
autoria: "Fernando Solanas e Octavio Getino"
ano: 1968
pais: "Argentina"
resumo: "Documentário em três partes, realizado de forma clandestina pelo grupo Cine Liberación, que analisa o neocolonialismo e a violência na Argentina e na América Latina. Pensado para sessões seguidas de debate, tornou-se referência do que seus realizadores chamaram de terceiro cinema."
