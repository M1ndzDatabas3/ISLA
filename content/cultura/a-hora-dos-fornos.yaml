titulo: "A hora dos fornos (La hora de los hornos)"
tipo: "filme"
autoria: "Fernando Solanas e Octavio Getino"
ano: 1968
pais: "Argentina"
resumo: "Documentário em três partes sobre o neocolonialismo e a violência na Argentina e na América Latina, realizado clandestinamente pelo grupo Cine Liberación. Pensado para sessões seguidas de debate, tornou-se referência do que seus realizadores chamaram de terceiro cinema."
